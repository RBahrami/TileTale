<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="A small sliding puzzle game." />
  <title>Sliding Puzzle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='3' fill='%234f46e5'/%3E%3Crect x='17' y='2' width='13' height='13' rx='3' fill='%23a5b4fc'/%3E%3Crect x='2' y='17' width='13' height='13' rx='3' fill='%23a5b4fc'/%3E%3Crect x='17' y='17' width='13' height='13' rx='6' fill='%23e2e8f0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">

    <!-- Screen A: password entry -->
    <section id="screen-password" class="screen" aria-labelledby="app-title">
      <h1 id="app-title" class="app-title">Sliding Puzzle</h1>
      <p class="app-subtitle">Enter the password to start.</p>
      <form id="password-form" autocomplete="off">
        <input
          id="password-input"
          class="password-input"
          type="text"
          name="password"
          placeholder="Password"
          maxlength="12"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          aria-label="Password"
        />
        <button id="password-submit" class="btn btn-primary" type="submit">Start</button>
        <p id="password-error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <!-- Screen B: game -->
    <section id="screen-game" class="screen" hidden aria-label="Game">
      <header class="game-header">
        <button id="back-btn" class="btn btn-ghost" type="button">&larr; Back</button>
        <span id="game-id" class="game-id"></span>
        <span class="moves-pill">Moves&nbsp;<b id="move-counter">0</b></span>
      </header>
      <div id="board" class="board" role="group" aria-label="Sliding puzzle board"></div>

      <!-- Completion result: shown below the board, never covering it, so the
           solved picture stays fully visible. At the same moment the board
           reveals the complete image (the empty cell fills in). -->
      <section id="result-panel" class="result-panel" role="status" hidden>
        <div class="result-head">
          <svg class="result-check" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <circle cx="10" cy="10" r="10" fill="currentColor" opacity="0.15" />
            <path d="M6 10.3l2.7 2.7L14.2 7.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <p class="result-title">Puzzle solved!</p>
        </div>
        <p class="result-label">Answer</p>
        <p id="result-answer" class="result-answer"></p>
        <button id="result-back-btn" class="btn btn-primary" type="button">Enter new password</button>
      </section>

      <div id="controls" class="controls">
        <button id="undo-btn" class="btn btn-secondary" type="button" disabled>Undo</button>
        <button id="restart-btn" class="btn btn-secondary" type="button">Restart</button>
        <button id="hint-btn" class="btn btn-secondary" type="button">Hint</button>
      </div>
      <p id="hint" class="hint">Tap a tile next to the empty space to move it. Arrow keys work too.</p>
    </section>

    <!-- Screen C: configuration error -->
    <section id="screen-error" class="screen" hidden aria-labelledby="error-title">
      <h1 id="error-title" class="app-title">Configuration error</h1>
      <p class="app-subtitle">The game could not start because of a problem in <code>config.js</code>.</p>
      <pre id="config-error-message" class="error-box"></pre>
    </section>

  </main>

  <!-- Visual solving-strategy guide: four schematic stages, no text by design.
       Purely presentational — it never modifies the game state. -->
  <div id="hint-modal" class="hint-modal" hidden>
    <div class="hint-card" role="dialog" aria-modal="true" aria-label="Solving strategy guide">
      <button id="hint-close" class="hint-close" type="button" aria-label="Close">
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </button>
      <div id="hint-viewport" class="hint-viewport">
        <div id="hint-track" class="hint-track"></div>
      </div>
      <div class="hint-nav">
        <button id="hint-prev" class="hint-arrow" type="button" aria-label="Previous stage" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div id="hint-dots" class="hint-dots"></div>
        <button id="hint-next" class="hint-arrow" type="button" aria-label="Next stage">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <noscript><p class="noscript">This game needs JavaScript to run.</p></noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
